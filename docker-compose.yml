version: "3.9"

services:
  globetrotter:
    build: .
    container_name: globetrotter_app
    ports:
      - "5000:5000"
    # Mount local code so changes are reflected without rebuilding the image
    volumes:
      - .:/globetrotter
    environment:
      - PORT=5000
  user_service:
    build: .
    container_name: user_service
    ports:
      - "5100:5100"
    volumes:
      - .:/app
    command: python user_service/app.py

  itinerary_service:
    build: .
    container_name: itinerary_service
    ports:
      - "5200:5200"
    volumes:
      - .:/app
    command: python itinerary_service/app.py

  recommendation_service:
    build: .
    container_name: recommendation_service
    ports:
      - "5300:5300"
    volumes:
      - .:/app
    command: python recommendation_service/app.py

  gateway:
    build: .
    container_name: api_gateway
    ports:
      - "5400:5400"
    volumes:
      - .:/app
    command: python gateway/app.py
